# ADD-ONLY snippet for the EXISTING checkout.juvenex.app server block.
# Do not replace that server block. Do not replace location /.
#
#   https://checkout.juvenex.app/           → existing application (leave as-is)
#   https://checkout.juvenex.app/staging    → this Next.js app (basePath /staging)
#
# This Next app must listen on a port the root app does not use.
# Default here: 127.0.0.1:3001  (see npm run start:staging)
#
# Preserve /staging. Do NOT use a URI on proxy_pass (no trailing slash after the port).
#   WRONG: proxy_pass http://127.0.0.1:3001/;     strips /staging
#   RIGHT: proxy_pass http://127.0.0.1:3001;      keeps /staging

upstream juvenex_staging_next {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Paste the location below INSIDE the existing server { } for checkout.juvenex.app.
# Place it before a catch-all location / if nginx would otherwise match / first
# with a prefix that also claims /staging (a plain location / does not steal /staging
# if this more specific location exists).

location /staging {
    proxy_pass http://juvenex_staging_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
}
