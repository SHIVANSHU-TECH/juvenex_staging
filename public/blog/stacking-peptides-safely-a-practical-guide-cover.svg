<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F8F3"/>
      <stop offset="100%" stop-color="#EEF1ED"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif" fill="#2D352C">
    <text x="80" y="220" font-size="22" font-weight="600" letter-spacing="6" opacity="0.7">ADVANCED</text>
    <text x="80" y="340" font-size="92" font-weight="800" letter-spacing="-2">Stacking Peptides</text>
    <text x="80" y="410" font-size="36" font-weight="500" opacity="0.85">A Practical Guide</text>
    <line x1="80" y1="470" x2="180" y2="470" stroke="#2D352C" stroke-width="4"/>
